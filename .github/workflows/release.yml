name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BIN_NAME: hpm_isp
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-release:
    name: build-${{ matrix.build }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [linux, macos, win-msvc]
        include:
          - build: linux
            os: ubuntu-24.04
            rust: stable
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
            archive: tar.gz
          - build: macos
            os: macos-15
            rust: stable
            target: aarch64-apple-darwin
            exe_suffix: ""
            archive: tar.gz
          - build: win-msvc
            os: windows-2022
            rust: stable
            target: x86_64-pc-windows-msvc
            exe_suffix: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ env.RELEASE_TAG }}

      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev libudev-dev

      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustup default ${{ matrix.rust }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-

      - name: Build and upload artifact
        uses: ./.github/actions/build-artifact
        with:
          binary-name: ${{ env.BIN_NAME }}
          artifact-version: ${{ env.RELEASE_TAG }}
          target: ${{ matrix.target }}
          profile: release
          archive: ${{ matrix.archive }}
          exe-suffix: ${{ matrix.exe_suffix }}
          artifact-name: release-${{ matrix.target }}
          retention-days: 7

  publish-release:
    name: publish-release
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
